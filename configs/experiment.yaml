project:
  name: "spdt-paper"
  seeds: [42, 123, 2026]          # satu RepeatedStratifiedKFold per seed
  output_root: "results"

datasets:
  iris:
    provider: "uci"
    id: 53
  wine:
    provider: "uci"
    id: 109
  seeds:
    provider: "uci"
    id: 236
  glass:
    provider: "uci"
    id: 42
    drop_columns: ["Id_number"]
  sonar:
    provider: "uci"
    id: 151
  ionosphere:
    provider: "uci"
    id: 52
  wdbc:
    provider: "uci"
    id: 17
  banknote:
    provider: "uci"
    id: 267

preprocessing:
  imputer:
    strategy: "median"            # fit on training partition only
  # decision trees tidak distandardisasi

cv:
  outer:
    type: "RepeatedStratifiedKFold"
    splits: 5
    repeats: 3
    seeds: [42, 123, 2026]        # 3 x (5 x 3) = 45 outer folds per dataset-method
  inner:
    type: "StratifiedKFold"
    splits: 3
    shuffle: true
    seed_derivation: "deterministic per outer split"

evaluation:
  primary_metric: "f1_macro"
  metrics:
    - "f1_macro"
    - "balanced_accuracy"
    - "accuracy"
    - "fit_seconds"
    - "predict_seconds"
    - "node_count"
    - "tree_depth"

models:
  cart_sklearn:
    estimator: "sklearn.tree.DecisionTreeClassifier"
    grid:
      criterion: ["gini"]
      max_depth: [3, 5, 8, null]
      min_samples_leaf: [1, 2, 5]
      min_samples_split: [2, 5, 10]
  cart_custom:
    estimator: "src.tree.StabilityTreeClassifier"
    fixed:
      penalty_lambda: 0.0         # wajib sama dengan CART custom untuk validasi
    grid:
      max_depth: [3, 5, 8, null]
      min_samples_leaf: [1, 2, 5]
      min_samples_split: [2, 5, 10]
  spdt:
    estimator: "src.tree.StabilityTreeClassifier"
    grid:
      penalty_lambda: [0.0, 0.01, 0.1, 1.0, 10.0]
      n_bootstrap: [5, 10, 20]
      max_depth: [3, 5, 8, null]
      min_samples_leaf: [1, 2, 5]
      min_samples_split: [2, 5, 10]
  random_forest:
    estimator: "sklearn.ensemble.RandomForestClassifier"
    optional: true                # benchmark kontekstual, bukan baseline ekuivalen
    fixed:
      n_estimators: 300
      random_state: 20261021
      n_jobs: -1
    grid:
      max_depth: [null]

artifacts:
  save_fold_predictions: true
  compression: "gzip"

stability:
  n_resamples: 10                 # disagreement prediksi antar model pada eval set
  eval_fraction: 0.2
